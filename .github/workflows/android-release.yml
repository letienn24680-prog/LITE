name: Build & Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build & Release LITE-Workspace.apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies, build web bundle, and sync Capacitor Android
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_PUBLIC_APP_URL: 'https://lite-git-main-ai-check-thd.vercel.app'
        run: |
          npm ci || npm install
          npm run build
          npx cap sync android

      - name: Build Android Debug APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug

      - name: Prepare LITE-Workspace.apk
        run: mv android/app/build/outputs/apk/debug/app-debug.apk LITE-Workspace.apk

      - name: Read version metadata from public/version.json
        id: ver
        run: |
          node -e '
          const fs = require("fs");
          const v = JSON.parse(fs.readFileSync("public/version.json", "utf8"));
          const out = process.env.GITHUB_OUTPUT;
          fs.appendFileSync(out, `version=${v.version}\n`);
          fs.appendFileSync(out, `changelog<<EOF\n${v.changelog || ""}\nEOF\n`);
          '

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: LITE Workspace v${{ steps.ver.outputs.version }}
          body: ${{ steps.ver.outputs.changelog }}
          make_latest: true
          files: LITE-Workspace.apk
